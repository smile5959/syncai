name: Deploy Frontend to Vercel

on:
  push:
    branches:
      - main
    paths:
      - 'syncai-frontend/**'

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Deploy to Vercel
        run: vercel deploy --prod --yes --token=${{ secrets.VERCEL_TOKEN }} --cwd syncai-frontend
        env:
          VERCEL_ORG_ID: team_ypscdIJQYpNCThbIvb7fLCUk
          VERCEL_PROJECT_ID: prj_nqZh3uPiPmIgygv7oLiSc239Zzby
