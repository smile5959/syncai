[package]
name = "syncai"
version = "0.1.0"
edition = "2021"

[lib]
name = "syncai_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "syncai"
path = "src/main.rs"

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
tauri-build = { version = "2", features = [] }
