app = "syncai-backend"
primary_region = "nrt"  # 도쿄 — 한국에서 가장 가까운 Fly.io 리전

[deploy]
  release_command = "alembic upgrade head"

[build]
  dockerfile = "Dockerfile"

[env]
  APP_ENV = "production"

# 환경변수는 fly secrets set 으로 주입 (fly.toml에 직접 쓰지 않음)
# fly secrets set SECRET_KEY=... DATABASE_URL=... REDIS_URL=... ANTHROPIC_API_KEY=...

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = false   # 콜드 스타트 방지 — 항상 켜둠
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "30s"
    interval = "15s"
    method = "GET"
    path = "/health"
    timeout = "5s"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 256   # 무료 티어 내
